name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # acceptance-guard가 기준 브랜치와의 merge-base를 찾으려면 전체 이력이 필요하다.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        id: install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # 이슈 #17 하네스 1단계. pnpm check:harness와 같은 검사.
      # 앞 단계(포맷·lint·타입·테스트)가 실패해도 설치만 됐으면 돈다. QA가 실패하는
      # 인수 테스트를 먼저 올린 draft PR에서도 하네스 검사 결과를 보기 위해서다.
      - name: Acceptance guard
        if: ${{ !cancelled() && steps.install.outcome == 'success' && github.event_name == 'pull_request' }}
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm check:acceptance-guard --base "origin/$BASE_REF" --head "$HEAD_SHA" --strict

      - name: Requirement trace
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm check:req-trace

      - name: ERD drift
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm check:erd-drift
