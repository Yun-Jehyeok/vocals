name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # acceptance-guard가 기준 브랜치와의 merge-base를 찾으려면 전체 이력이 필요하다.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # 이슈 #17 하네스 1단계. pnpm check:harness와 같은 검사.
      - name: Acceptance guard
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm check:acceptance-guard --base "origin/$BASE_REF" --head "$HEAD_SHA" --strict

      - name: Requirement trace
        run: pnpm check:req-trace

      - name: ERD drift
        run: pnpm check:erd-drift
