# Supabase CLI 설정 (이슈 #59). PM이 테스트 프로젝트에 마이그레이션을 올릴 때만 쓴다(supabase/README.md).
# 로컬 개발·테스트는 CLI·Docker 없이 PGlite로 한다(pnpm db:reset, pnpm test). 이 파일은 그 흐름에 쓰이지 않는다.
#
# - 원격 프로젝트 ref는 여기에 적지 않는다. `supabase link`가 supabase/.temp/에 저장한다(.gitignore).
# - 여기에 없는 값은 CLI 기본값을 쓴다. `supabase config push`로 이 파일을 원격에 올리지 않는다.

# 로컬 이름. 원격 프로젝트와 상관없다.
project_id = "vocals"

[db]
# 테스트 프로젝트(vocals-test)의 Postgres 메이저 버전
major_version = 17

[db.seed]
# seed.sql은 로컬 더미 데이터다. 플래그 없이 도는 seed를 끈다.
# 이 설정은 원격 seed를 막지 못한다. CLI 3.x의 `db push --include-seed`는 이 값을 무시하고 seed를 넣는다.
# 원격에 seed를 넣지 않는 것은 supabase/README.md "하지 말 것"으로 지킨다.
enabled = false
